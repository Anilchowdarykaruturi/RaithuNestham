<div class="login-page">

  <div class="login-box">

    <h1>🌾 RaithuNestham</h1>

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <!-- Username -->
      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your username"
          required
          [disabled]="loading"
        />

      </div>

      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
          [disabled]="loading"
        />

      </div>

      <!-- Error message -->
      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }

      <!-- Login button -->
      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Logging in...
        } @else {
          Login
        }

      </button>

    </form>

    <p>
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>

</div>
